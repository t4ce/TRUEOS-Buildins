[package]
name = "edit"
version = "2.0.0"

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

build = "build/main.rs"
categories = ["text-editors"]

[package.metadata.trueos-blueprint]
replicatable = false
entry-abi = "argv-v1"

[[bin]]
name = "edit"
path = "src/bin/edit/main.rs"

[features]
# Display editor latency in the top-right corner
debug-latency = []
# Enable the TRUEOS project session and its Compile action.
ide = ["dep:trueos-ide", "dep:serde_json"]

[dependencies]
lsh.workspace = true
stdext.workspace = true
trueos-ide = { path = "../../../../TRUEOS-Blueprints/crates/trueos-ide", optional = true }
serde_json = { version = "1.0.142", optional = true }

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../../../TRUEOS-Blueprints/api" }

[target.'cfg(all(unix, not(target_os = "trueos")))'.dependencies]
libc = "=0.2.186"

[build-dependencies]
stdext.workspace = true
lsh.workspace = true
# The default toml crate bundles its dependencies with bad compile times. Thanks.
# Thankfully toml-span exists. FWIW the alternative is yaml-rust (without the 2 suffix).
toml-span = { version = "=0.7.1", default-features = false }
