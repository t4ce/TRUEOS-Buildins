[package]
name = "share-native-tests"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bytes = "1"
dav-server = { version = "=0.11.0", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
trueos-path = { path = "../../../TRUEOS/crates/trueos-path" }
tokio = { version = "=1.54.1", default-features = false, features = ["macros", "rt"] }
http = "1"
http-body-util = "0.1"

[patch.crates-io]
dav-server = { path = "../../vendor/dav-server-0.11.0" }
headers = { path = "../../vendor/headers-0.4.2" }
headers-core = { path = "../../vendor/headers-core-0.3.0" }
xml-rs = { path = "../../vendor/xml-rs-1.0.0" }
xml = { path = "../../vendor/xml-1.4.0" }
xmltree = { path = "../../vendor/xmltree-0.12.0" }
htmlescape = { path = "../../vendor/htmlescape-0.3.1" }
mime = { path = "../../vendor/mime-0.3.18" }
