[package]
categories = ["gui"]
description = "Types for handling UI scaling"
edition.workspace = true
keywords = ["DPI", "HiDPI", "scale-factor"]
# N.B. This is "AND", because of the imported libm code.
license = "Apache-2.0 AND MIT"
name = "dpi"
repository.workspace = true
rust-version.workspace = true
version = "0.1.2"

[features]
default = ["std"]

mint = ["dep:mint"]
serde = ["dep:serde"]

# Access mathematical functions using the standard library implementations
std = []

[dependencies]
mint = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[package.metadata.docs.rs]
features = ["mint", "serde"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["i686-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
