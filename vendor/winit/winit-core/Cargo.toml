[package]
authors = ["The winit contributors", "Kirill Chibisov <contact@kchibisov.com>"]
categories = ["gui"]
description = "winit core API."
documentation = "https://docs.rs/winit-core"
edition.workspace = true
keywords = ["windowing"]
license.workspace = true
name = "winit-core"
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
trueos-native = ["dep:trueos-runtime", "dep:trueos-io", "dep:trueos-path", "dep:num-traits"]
serde = [
    "dep:serde",
    "bitflags/serde",
    "cursor-icon/serde",
    "dpi/serde",
    "keyboard-types/serde",
    "smol_str/serde",
]

[dependencies]
bitflags.workspace = true
cursor-icon.workspace = true
dpi.workspace = true
keyboard-types.workspace = true
rwh_06.workspace = true
serde = { workspace = true, optional = true }
smol_str.workspace = true
url.workspace = true

[target.'cfg(target_os = "trueos")'.dependencies]
trueos-runtime = { workspace = true, optional = true }
trueos-io = { workspace = true, optional = true }
trueos-path = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }

[target.'cfg(not(target_os = "trueos"))'.dependencies]
cursor-icon = { workspace = true, features = ["std"] }
dpi = { workspace = true, features = ["std"] }
keyboard-types = { workspace = true, features = ["std"] }
rwh_06 = { workspace = true, features = ["std"] }
smol_str = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
winit.workspace = true
