[workspace]
default-members = ["winit"]
members = ["dpi", "winit", "winit-common", "winit-core", "winit-trueos", "winit-wayland", "winit-x11"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rust-windowing/winit"
rust-version = "1.86"
version = "0.31.0-beta.3"

[workspace.dependencies]
# Workspace dependencies.
# `winit` has no version here to allow using it in dev deps for docs.
winit = { path = "winit" }
winit-common = { version = "=0.31.0-beta.3", path = "winit-common" }
winit-core = { version = "=0.31.0-beta.3", path = "winit-core" }
winit-trueos = { version = "=0.31.0-beta.3", path = "winit-trueos" }
winit-wayland = { version = "=0.31.0-beta.3", path = "winit-wayland", default-features = false }
winit-x11 = { version = "=0.31.0-beta.3", path = "winit-x11" }

# Core dependencies.
bitflags = "2"
cfg_aliases = "0.2.2"
cursor-icon = "1.1.0"
dpi = { version = "0.1.2", path = "dpi" }
keyboard-types = "0.8.0"
mint = "0.5.6"
rwh_06 = { package = "raw-window-handle", version = "0.6", path = "../raw-window-handle", features = ["std"] }
serde = { version = "1", features = ["serde_derive"] }
smol_str = "0.3"
tracing = { version = "0.1.40", default-features = false }
url = "2"

# Dev dependencies.
image = { version = "0.25.0", default-features = false }
softbuffer = { version = "0.4.8", default-features = false, features = [
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
] }
tracing-subscriber = "0.3.18"

# Linux dependencies.
bytemuck = { version = "1.13.1", default-features = false }
calloop = "0.14.3"
foldhash = { version = "0.2.0", default-features = false, features = ["std"] }
libc = "0.2.64"
memmap2 = "0.9.0"
percent-encoding = "2.0"
rustix = { version = "1.0.7", default-features = false }
x11-dl = "2.19.1"
x11rb = { version = "0.13.0", default-features = false }
xkbcommon-dl = "0.4.2"

[patch.crates-io]
raw-window-handle = { path = "../raw-window-handle" }
