[package]
edition = "2015"
name = "htmlescape"
version = "0.3.1"
authors = [ "Viktor Dahl <pazaconyoman@gmail.com>" ]
license = "Apache-2.0 / MIT / MPL-2.0"
repository = "https://github.com/veddan/rust-htmlescape"
description = "A library for HTML entity encoding and decoding"

[lib]
name = "htmlescape"
path = "src/lib.rs"

[dev-dependencies]
rand = "0.4.6"

[features]
trueos-native = ["dep:trueos-io"]

[dependencies.trueos-io]
path = "../../../TRUEOS/crates/trueos-io"
optional = true
