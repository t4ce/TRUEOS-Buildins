[package]
name = "trauma-native-tests"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[features]
default = ["native-fixture"]
native-fixture = []
[dependencies]
futures-util = { version = "=0.3.32", default-features = false, features = ["alloc", "async-await"] }
sha2 = { version = "=0.11.1", default-features = false }
http = "=1.4.0"
url = { version = "=2.5.8", default-features = false }
trueos-path = { path = "../../../TRUEOS/crates/trueos-path" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "macros", "test-util", "io-util"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
percent-encoding = { version = "2.3", default-features = false, features = ["alloc"] }
