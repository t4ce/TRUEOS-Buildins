[package]
name = "trauma"
version = "3.0.0"
edition = "2021"
license = "MIT"
description = "Simplify and prettify HTTP downloads"
homepage = "https://github.com/rgreinho/trauma"
repository = "https://github.com/rgreinho/trauma"
readme = "README.md"
categories = ["concurrency"]
keywords = ["http", "download", "async", "tokio"]

[dependencies]
futures-util = { version = "=0.3.32", default-features = false, features = ["alloc", "async-await"] }
sha2 = { version = "=0.11.1", default-features = false }
tokio = { path = "../vendor/tokio-1.54.1", version = "=1.54.1", default-features = false, features = ["rt", "time"] }
bon = { version = "=3.9.3", default-features = false, features = ["alloc"] }
http = { version = "=1.4.0", default-features = false }
url = { version = "=2.5.8", default-features = false }

[target.'cfg(not(target_os = "trueos"))'.dependencies]
indicatif = { version = "=0.18.0", optional = true }
reqwest-middleware = "=0.5.2"
reqwest-retry = { version = "=0.9.1", default-features = false }
tracing = { path = "../vendor/tracing-0.1.44", version = "=0.1.44", default-features = false, features = ["std"] }
tokio = { path = "../vendor/tokio-1.54.1", version = "=1.54.1", default-features = false, features = ["fs", "io-util", "net"] }

[target.'cfg(not(target_os = "trueos"))'.dependencies.reqwest]
path = "../vendor/reqwest-0.13.3"
version = "=0.13.3"
default-features = false
features = [
  "http2",
  "stream",
]

[dev-dependencies]
# Only examples use the Tokio entrypoint macro.
tokio = { path = "../vendor/tokio-1.54.1", version = "=1.54.1", features = ["macros"] }

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
default-tls = ["reqwest/default-tls"]
# Presentation and optional proxy integration stay outside the lean default build.
terminal-progress = ["dep:indicatif"]
retry-tracing = ["reqwest-retry/tracing"]
socks = ["reqwest/socks"]
system-proxy = ["reqwest/system-proxy"]

# The packer stages ordinary main() into the Blueprint entrypoint.
[[bin]]
name = "trauma"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../vendor/trueos", features = ["native-runtime"] }
trueos-path = { path = "../../TRUEOS/crates/trueos-path" }
trueos-runtime = { path = "../../TRUEOS/crates/trueos-runtime" }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
percent-encoding = { version = "2.3", default-features = false, features = ["alloc"] }

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[[example]]
name = "with-style"
required-features = ["terminal-progress"]
