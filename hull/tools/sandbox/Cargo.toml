[package]
name = "hull-sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "hull-sandbox"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hull-quickjs = { path = "../../crates/quickjs-engine" }
rp5 = { path = "../../rp5" }
rjqry = { path = "../../rjqry" }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["into_owned", "substitute_variables"] }
static-self = "0.1.2"
taffy = { version = "=0.15.0", path = "../../../vendor/taffy-0.15.0-trueos", default-features = false, features = ["std", "taffy_tree", "block_layout", "flexbox", "grid"] }
infer = { path = "../../../../TRUEOS/vendor/infer", default-features = false }
parcel_selectors = "0.28.3"
cssparser = "0.37"
serde_json = "1"
url = "2.5"
tokio = { path = "../../../vendor/tokio-1.54.1", default-features = false, features = ["rt", "sync", "time"] }

[workspace]
