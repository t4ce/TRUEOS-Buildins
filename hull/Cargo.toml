[package]
name = "hull"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hull"
path = "src/main.rs"
test = false
bench = false

[dependencies]
infer = { path = "../../TRUEOS/vendor/infer", default-features = false }
hull-quickjs = { path = "crates/quickjs-engine" }
crossterm = { path = "../../vendor/crossterm-0.29.0-trueos", default-features = false, features = ["events", "bracketed-paste"] }
trueos = { path = "../../api", features = ["ui4-scene", "tokio-runtime"] }
rp5 = { path = "rp5" }
rjqry = { path = "rjqry" }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["into_owned", "substitute_variables"] }
static-self = "0.1.2"
taffy = { version = "=0.15.0", path = "../../vendor/taffy-0.15.0-trueos", default-features = false, features = ["std", "taffy_tree", "block_layout", "flexbox", "grid"] }
parcel_selectors = "0.28.3"
cssparser = "0.37"
serde_json = "1"
url = "2.5"
winit = { path = "../../vendor/winit/winit", default-features = false }

[profile.release]
codegen-units = 1           # reduces binary size by ~2%
debug = "full"              # No one needs an undebuggable release binary
lto = true                  # reduces binary size by ~14%
opt-level = "s"             # reduces binary size by ~25%
panic = "abort"             # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
strip = "symbols"           # See split-debuginfo - allows us to drop the size by ~65%
incremental = true          # Improves re-compile times

[workspace]
exclude = ["crates/quickjs-engine", "rjqry", "rcorejs", "tools/js-tests", "tools/layout-tests", "tools/sandbox"]
