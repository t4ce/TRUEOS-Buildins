[package]
name = "apps"
version = "0.1.0"
edition = "2024"
[package.metadata.trueos-blueprint]
fs-scope = "trueosfs"
entry-abi = "argv-v1"
[[bin]]
name = "apps"
path = "src/main.rs"
[workspace]
[dependencies]
trueos = { path = "../vendor/trueos", features = ["native-runtime"] }
crossterm = { path = "../vendor/crossterm-0.29.0-trueos", default-features = false, features = ["events", "native-core"] }
sha2 = { version = "=0.10.9", default-features = false }

# Archive verification remains local to Apps; transport and TLS belong to the kernel.
[profile.dev.package.sha2]
opt-level = 3

# Keep direct host tests on the same owned platform crates as the rig driver.
[patch.crates-io]
tokio = { path = "../vendor/tokio-1.54.1" }
mio = { path = "../../TRUEOS/vendor/mio-1.2.0" }
rustix = { path = "../vendor/rustix-1.1.4-trueos" }
signal-hook-mio = { path = "../vendor/signal-hook-mio-0.2.5-trueos" }
