[package]
name = "apps"
version = "0.1.0"
edition = "2024"
[package.metadata.trueos-blueprint]
fs-scope = "trueosfs"
entry-abi = "argv-v1"
[[bin]]
name = "apps"
path = "src/main.rs"
[workspace]
[dependencies]
trueos = { path = "../vendor/trueos", features = ["native-runtime"] }
crossterm = { path = "../vendor/crossterm-0.29.0-trueos", default-features = false, features = ["events", "native-core"] }
sha2 = { version = "=0.11.1", default-features = false }
trueos-appbundle = { path = "../../TRUEOS-Blueprints/crates/trueos-appbundle" }

# Archive verification remains local to Apps; transport and TLS belong to the kernel.
[profile.dev.package.sha2]
opt-level = 3
