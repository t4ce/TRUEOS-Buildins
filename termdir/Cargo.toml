[package]
name = "termdir"
version = "0.14.0"
edition = "2024"

[package.metadata.trueos-blueprint]
fs-scope = "trueosfs"

[[bin]]
name = "termdir"
path = "src/main.rs"

[workspace]

[dependencies]
crossterm = { path = "../vendor/crossterm-0.29.0-trueos", default-features = false, features = ["events"] }
sha2 = { version = "=0.11.1", default-features = false }
trueos = { path = "../vendor/trueos" }
trueos-path = { path = "../../TRUEOS/crates/trueos-path" }
trueos-runtime = { path = "../../TRUEOS/crates/trueos-runtime" }
libm = { version = "0.2", default-features = false }

[target.'cfg(target_os = "trueos")'.dependencies]
crossterm = { path = "../vendor/crossterm-0.29.0-trueos", default-features = false, features = ["events", "native-core"] }

[patch.crates-io]
mio = { path = "../../TRUEOS/vendor/mio-1.2.0" }
rustix = { path = "../vendor/rustix-1.1.4-trueos" }
signal-hook-mio = { path = "../vendor/signal-hook-mio-0.2.5-trueos" }

[profile.dev]
codegen-units = 1         
debug = "full"            
lto = true                
opt-level = 3        
panic = "abort"           
split-debuginfo = "packed"
strip = "symbols"         
incremental = true        

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }
