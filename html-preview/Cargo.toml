[package]
name = "html-preview"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "macros", "fs", "io-util"] }
hyper = { version = "=1.10.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
serde_json = "1"
percent-encoding = "2"
trueos-ide = { path = "../../TRUEOS-Blueprints/crates/trueos-ide", default-features = false }

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../TRUEOS-Blueprints/api", features = ["tokio-runtime", "tokio-net-probe"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos"))'] }

[workspace]
